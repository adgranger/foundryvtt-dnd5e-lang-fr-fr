name: Auto Merge Weblate PR

on:
  pull_request:
    types: [opened, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR author and title
        id: check_pr
        run: |
          if [ "${{ github.event.pull_request.user.login }}" == "fonderie-vtt-weblate" ] && \
             [ "${{ github.event.pull_request.title }}" == "Translations update from Fonderie VTT - Weblate" ]; then
            echo "::set-output name=is_trusted::true"
          else
            echo "::set-output name=is_trusted::false"
          fi

      - name: Merge PR
        if: steps.check_pr.outputs.is_trusted == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --rebase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
